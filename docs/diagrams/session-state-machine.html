<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheel Agent · 会话生命周期状态机</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State Machine · Session Lifecycle</p>
    <h1>会话文件的一生</h1>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wa-state-title wa-state-desc">
      <title id="wa-state-title">Wheel Agent 会话生命周期状态机</title>
      <desc id="wa-state-desc">状态机：会话从新建进入就绪；用户回合驱动运行态，运行中反复工具调用后回到就绪；上下文将满时压缩，重写后继续；退出后归档；任意状态崩溃都经修复加载回到就绪（注释说明）。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- transitions (drawn before state boxes) -->
      <!-- 1: start -> ready -->
      <line x1="102" y1="144" x2="192" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="124" y="120" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="144" y="131" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">/new</text>

      <!-- 2: ready -> running -->
      <line x1="356" y1="160" x2="416" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="356" y="136" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="360" y="148" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC',sans-serif">用户回合</text>

      <!-- 3: running self loop -->
      <path d="M 474,128 Q 502,82 530,126" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="466" y="56" width="72" height="16" rx="2" fill="#f5f5f5"/>
      <text x="470" y="68" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">工具调用</text>

      <!-- 4: running -> ready (return) -->
      <path d="M 460,190 Q 432,238 388,240 Q 346,242 344,194" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="344" y="252" width="104" height="16" rx="2" fill="#f5f5f5"/>
      <text x="348" y="264" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC',sans-serif">回合结束 · 追加</text>

      <!-- 5: ready -> compacted (accent) -->
      <line x1="276" y1="196" x2="276" y2="312" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="284" y="272" width="128" height="16" rx="2" fill="#f5f5f5"/>
      <text x="288" y="284" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC',sans-serif">上下文将满 /compact</text>

      <!-- 6: compacted -> ready (left return) -->
      <path d="M 200,338 Q 128,320 128,252 Q 128,176 194,168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="136" y="250" width="60" height="16" rx="2" fill="#f5f5f5"/>
      <text x="140" y="262" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC',sans-serif">重写·继续</text>

      <!-- 7: ready -> archived -->
      <path d="M 228,192 Q 180,240 172,300 Q 164,390 160,456" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="180" y="288" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="184" y="300" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">/quit</text>

      <!-- state boxes -->
      <!-- start -->
      <circle cx="96" cy="144" r="6" fill="#2d3142"/>

      <!-- ready -->
      <rect x="200" y="132" width="152" height="56" rx="8" fill="#f5f5f5"/>
      <rect x="200" y="132" width="152" height="56" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="276" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">就绪</text>
      <text x="276" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">.wheel/session</text>

      <!-- running (focal) -->
      <rect x="424" y="130" width="148" height="60" rx="8" fill="#f5f5f5"/>
      <rect x="424" y="130" width="148" height="60" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="498" y="154" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">运行中</text>
      <text x="498" y="172" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">model + tools</text>

      <!-- compacted -->
      <rect x="200" y="316" width="152" height="56" rx="8" fill="#f5f5f5"/>
      <rect x="200" y="316" width="152" height="56" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="276" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">已压缩</text>
      <text x="276" y="358" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">summary + suffix</text>

      <!-- end -->
      <circle cx="160" cy="468" r="8" fill="none" stroke="#2d3142" stroke-width="1.2"/>
      <circle cx="160" cy="468" r="5" fill="#2d3142"/>
      <rect x="180" y="460" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="184" y="472" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC',sans-serif">已归档</text>

      <!-- annotation: crash recovery -->
      <rect x="424" y="300" width="516" height="72" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="440" y="328" fill="#4f5d75" font-size="14" font-family="'Instrument Serif','Noto Serif SC',serif" font-style="italic">崩溃恢复：加载时跳过损坏的尾行，为缺失输出的工具调用</text>
      <text x="440" y="352" fill="#4f5d75" font-size="14" font-family="'Instrument Serif','Noto Serif SC',serif" font-style="italic">补一条合成结果，回到就绪——任意状态崩溃都走这条路。</text>

      <!-- legend -->
      <line x1="30" y1="504" x2="970" y2="504" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <circle cx="100" cy="524" r="5" fill="#2d3142"/>
      <text x="112" y="528" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">START</text>
      <circle cx="188" cy="524" r="7" fill="none" stroke="#2d3142" stroke-width="1.2"/>
      <circle cx="188" cy="524" r="4" fill="#2d3142"/>
      <text x="204" y="528" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">END</text>
      <rect x="264" y="516" width="16" height="14" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="288" y="528" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">FOCAL STATE</text>
      <line x1="392" y1="523" x2="420" y2="523" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="428" y="528" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">COMPACTION</text>
      <rect x="540" y="516" width="16" height="14" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="564" y="528" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">ANNOTATION</text>
    </svg>
  </div>
</body>
</html>
