<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheel Agent · Agent 循环时序</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Agent Loop</p>
    <h1>一个回合里发生了什么</h1>

    <svg viewBox="0 0 1000 644" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wa-seq-title wa-seq-desc">
      <title id="wa-seq-title">Wheel Agent 一个回合的时序</title>
      <desc id="wa-seq-desc">时序图：用户在 REPL 输入任务，循环调用模型端点拿流式响应，执行工具，工具结果写回会话文件，循环片段内按工具数量重复，最终答案经事件流渲染回终端。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- lifelines (drawn early; activations & messages go on top) -->
      <line x1="120" y1="120" x2="120" y2="580" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="372" y1="120" x2="372" y2="580" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="628" y1="120" x2="628" y2="580" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="856" y1="120" x2="856" y2="580" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- loop fragment frame (drawn before messages) -->
      <rect x="336" y="284" width="608" height="204" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="336" y="284" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="356" y="296" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <text x="388" y="296" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[直到模型不再要工具 / 回合上限 / 中止]</text>

      <!-- messages -->
      <!-- m1: user -> repl -->
      <line x1="120" y1="164" x2="320" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="164" y="138" width="112" height="16" rx="2" fill="#f5f5f5"/>
      <text x="220" y="150" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">输入任务 · steer</text>

      <!-- m2: repl -> loop -->
      <line x1="372" y1="216" x2="620" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="420" y="196" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="496" y="205" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RUN_AGENT</text>

      <!-- m3: loop -> api -->
      <line x1="628" y1="332" x2="848" y2="332" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="676" y="312" width="124" height="12" rx="2" fill="#f5f5f5"/>
      <text x="738" y="321" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STREAM RESPONSES</text>

      <!-- m3 return: api -> loop (dashed, filled marker) -->
      <line x1="848" y1="368" x2="636" y2="368" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="668" y="348" width="148" height="12" rx="2" fill="#f5f5f5"/>
      <text x="742" y="357" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAY/THINK · CALLS</text>

      <!-- m4: loop -> repl (self message on loop lifeline) -->
      <path d="M 624,404 H 596 Q 588,404 588,412 V 436 Q 588,444 596,444 H 624" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="436" y="412" width="144" height="16" rx="2" fill="#f5f5f5"/>
      <text x="508" y="424" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">执行工具 · 裁剪输出</text>

      <!-- m5: loop -> repl events -->
      <line x1="620" y1="468" x2="380" y2="468" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="452" y="448" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="457" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVENTS</text>

      <!-- m6: repl -> user final -->
      <line x1="364" y1="544" x2="124" y2="544" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="164" y="520" width="160" height="16" rx="2" fill="#f5f5f5"/>
      <text x="244" y="532" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">最终答案 · 停止原因</text>

      <!-- activation bars -->
      <rect x="368" y="152" width="8" height="420" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="624" y="324" width="8" height="156" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="852" y="324" width="8" height="52" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- actors -->
      <rect x="60" y="88" width="120" height="36" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="88" width="120" height="36" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="120" y="111" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">用户</text>

      <rect x="304" y="88" width="136" height="36" rx="6" fill="#f5f5f5"/>
      <rect x="304" y="88" width="136" height="36" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="372" y="111" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">REPL · 渲染器</text>

      <rect x="560" y="88" width="136" height="36" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="88" width="136" height="36" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="628" y="111" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">agent 循环</text>

      <rect x="784" y="88" width="144" height="36" rx="6" fill="#f5f5f5"/>
      <rect x="784" y="88" width="144" height="36" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="856" y="105" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">OpenAI 兼容端点</text>
      <text x="856" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">responses / chat</text>

      <!-- side note: session append (dashed, passive) -->
      <rect x="136" y="316" width="188" height="88" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="230" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">会话文件</text>
      <text x="230" y="364" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">每条 fsync 落盘</text>
      <text x="230" y="384" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">崩溃丢最后一行</text>

      <!-- legend -->
      <line x1="30" y1="596" x2="970" y2="596" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="618" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="100" y1="614" x2="128" y2="614" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="136" y="618" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">API CALL</text>
      <line x1="228" y1="614" x2="256" y2="614" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="264" y="618" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">STREAM / EVENTS</text>
      <line x1="412" y1="614" x2="440" y2="614" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="448" y="618" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">HEADLINE</text>
      <rect x="548" y="606" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="572" y="618" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">FOCAL ACTOR</text>
      <rect x="668" y="604" width="236" height="18" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="678" y="617" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">LOOP FRAGMENT</text>
    </svg>
  </div>
</body>
</html>
