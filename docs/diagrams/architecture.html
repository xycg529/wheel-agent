<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheel Agent · 系统架构</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
    .cjk { font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">System Architecture · Wheel Agent</p>
    <h1>一个循环 · 一个文件 · 一个终端</h1>

    <svg viewBox="0 0 1000 712" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wa-arch-title wa-arch-desc">
      <title id="wa-arch-title">Wheel Agent 系统架构</title>
      <desc id="wa-arch-desc">架构图：终端 UI 层的 REPL 与实时渲染，向下进入核心层的 agent 循环，循环右侧连模型客户端与外部的 OpenAI 兼容端点，下连会话存储；支撑层的工具运行时与 harness 笔记库在最下方。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- zones -->
      <rect x="40" y="56" width="624" height="136" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="52" y="60" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="96" y="69" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">UI · TERMINAL</text>

      <rect x="40" y="216" width="624" height="244" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="52" y="220" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="104" y="229" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CORE · LOOP</text>

      <rect x="40" y="512" width="624" height="136" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="52" y="516" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="108" y="525" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SUPPORT</text>

      <!-- arrows (before nodes) -->
      <!-- a: REPL -> loop -->
      <line x1="216" y1="160" x2="216" y2="262" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="222" y="198" width="84" height="16" rx="2" fill="#f5f5f5"/>
      <text x="228" y="210" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC',sans-serif">任务 · steer</text>

      <!-- b: loop -> renderer (event stream) -->
      <path d="M 312,264 V 212 Q 312,204 320,204 H 464 Q 472,204 472,196 V 162" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="344" y="184" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="392" y="193" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVENTS</text>

      <!-- c: loop -> model client -->
      <line x1="368" y1="288" x2="406" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- d: model client -> endpoint -->
      <line x1="648" y1="296" x2="710" y2="296" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="656" y="278" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="676" y="287" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

      <!-- e: loop -> session store -->
      <path d="M 312,336 V 404 Q 312,412 320,412 H 406" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="320" y="368" width="76" height="16" rx="2" fill="#f5f5f5"/>
      <text x="326" y="380" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC',sans-serif">追加条目</text>

      <!-- f: loop -> tools -->
      <line x1="216" y1="336" x2="216" y2="550" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="222" y="432" width="76" height="16" rx="2" fill="#f5f5f5"/>
      <text x="228" y="444" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC',sans-serif">工具调用</text>

      <!-- g: tools -> harness -->
      <line x1="368" y1="584" x2="406" y2="584" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- nodes -->
      <!-- 1 REPL -->
      <rect x="100" y="96" width="232" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="100" y="96" width="232" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="108" y="102" width="36" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="126" y="111" fill="rgba(122,131,153,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="216" y="130" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">REPL 输入编辑器</text>
      <text x="216" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ui/repl.py</text>

      <!-- 2 renderer -->
      <rect x="340" y="96" width="264" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="96" width="264" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="348" y="102" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="360" y="111" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="472" y="130" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">实时渲染 · 事件视图</text>
      <text x="472" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ui/app · core/events.py</text>

      <!-- 3 loop (focal) -->
      <rect x="64" y="264" width="304" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="264" width="304" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="72" y="270" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="90" y="279" fill="rgba(235,108,54,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOOP</text>
      <text x="216" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">agent 循环</text>
      <text x="216" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">core/loop.py</text>

      <!-- 4 model client -->
      <rect x="408" y="264" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="408" y="264" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="416" y="270" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="438" y="279" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
      <text x="528" y="298" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">模型客户端</text>
      <text x="528" y="314" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">core/model.py</text>

      <!-- 5 endpoint (external) -->
      <rect x="712" y="264" width="248" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="712" y="264" width="248" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="720" y="270" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="736" y="279" fill="rgba(45,49,66,0.6)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="836" y="298" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">OpenAI 兼容端点</text>
      <text x="836" y="314" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/v1/responses · /v1/chat</text>

      <!-- 6 session store -->
      <rect x="408" y="380" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="408" y="380" width="240" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="416" y="386" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="436" y="395" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILE</text>
      <text x="528" y="414" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">会话存储 · 压缩</text>
      <text x="528" y="430" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">session.py · compact.py</text>

      <!-- 7 tools -->
      <rect x="64" y="552" width="304" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="552" width="304" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="72" y="558" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="92" y="567" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOLS</text>
      <text x="216" y="586" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">工具运行时 · 安全门</text>
      <text x="216" y="602" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tools/ · 13 tools · safety</text>

      <!-- 8 harness -->
      <rect x="408" y="552" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="408" y="552" width="240" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="416" y="558" width="56" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="444" y="567" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NOTES</text>
      <text x="528" y="586" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">harness 笔记库</text>
      <text x="528" y="602" fill="#7a8399" font-size="9" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">写入后续每次系统提示</text>

      <!-- legend -->
      <line x1="30" y1="664" x2="970" y2="664" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="686" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="100" y="678" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="124" y="688" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">FOCAL</text>
      <rect x="200" y="678" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="224" y="688" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">MODULE</text>
      <rect x="312" y="678" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="336" y="688" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">STORE</text>
      <rect x="412" y="678" width="16" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="436" y="688" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">EXTERNAL</text>
      <rect x="528" y="678" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="552" y="688" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">INPUT</text>
      <line x1="640" y1="684" x2="668" y2="684" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="676" y="688" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">API CALL</text>
      <line x1="768" y1="684" x2="796" y2="684" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="804" y="688" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">EVENTS</text>
    </svg>
  </div>
</body>
</html>
